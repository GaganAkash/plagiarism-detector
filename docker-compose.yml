services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plagcheck
      POSTGRES_PASSWORD: plagcheck
      POSTGRES_DB: plagcheck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://plagcheck:plagcheck@db:5432/plagcheck
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      BING_API_KEY: ""
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.workers.scan_tasks worker -l info -c 2
    volumes:
      - .:/app
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://plagcheck:plagcheck@db:5432/plagcheck
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      BING_API_KEY: ""
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
  uploads:
