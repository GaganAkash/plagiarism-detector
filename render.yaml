# Render blueprint for the API (single web service + managed Postgres).
# Deploy: push to GitHub and connect repo on Render, or `render blueprint launch`.
# Required env vars are wired below; set SECRET_KEY to a long random value.
services:
  - type: web
    name: plagiarism-detector-api
    runtime: docker
    repo: https://github.com/GaganAkash/plagiarism-detector
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plagiarism-detector-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BING_API_KEY
        sync: false
      # Email OTP (Gmail app password). EMAIL_ENABLED="true" turns it on.
      - key: EMAIL_ENABLED
        value: "false"
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

databases:
  - name: plagiarism-detector-db
    plan: free
